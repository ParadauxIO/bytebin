name: Build and Push Docker Image to Harbor

on:
  push:
    branches:
      - master
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          # bytebin (this vendored fork) backs the `pastes` paradaux app, so the
          # Harbor repo is paradaux-public/pastes — matches apps/pastes overlay
          # path and the generic ApplicationSet image-updater annotation.
          #
          # The other in-cluster bytebin instance (`exports`) is currently still
          # pulling upstream ghcr.io/lucko/bytebin:latest, not this fork — see
          # apps/exports/overlays/production/resources.yaml. Migrating exports
          # to harbor is a separate decision (fork vs upstream).
          #
          # Env-prefixed immutable tag follows the same scheme as the rest of
          # the cluster. bytebin's released branch is `master` (NOT main) per
          # its vendored-fork convention.
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "${{ github.ref_name }}" == "master" ]; then
            ENV_NAME=production
            MUTABLE=prod
          elif [ "${{ github.ref_name }}" == "develop" ]; then
            ENV_NAME=development
            MUTABLE=latest
          else
            echo "Unsupported branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "SHA_TAG=${ENV_NAME}-sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "MUTABLE_TAG=${MUTABLE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE=${{ secrets.HARBOR_REGISTRY }}/paradaux-public/pastes
          docker build \
            -t "${IMAGE}:${{ steps.tags.outputs.SHA_TAG }}" \
            -t "${IMAGE}:${{ steps.tags.outputs.MUTABLE_TAG }}" \
            .

      - name: Push Docker image
        run: |
          IMAGE=${{ secrets.HARBOR_REGISTRY }}/paradaux-public/pastes
          docker push "${IMAGE}:${{ steps.tags.outputs.SHA_TAG }}"
          docker push "${IMAGE}:${{ steps.tags.outputs.MUTABLE_TAG }}"
